name: Cinema City watchdog

# Checks the Cinema City schedule and, when new showtimes of The Odyssey in
# IMAX appear, opens an issue (GitHub turns it into an e-mail and an app push).
#
# Scheduled every 5 minutes even though the goal is detection within ~30
# minutes: under load GitHub drops scheduled runs in droves (measured: 1 of 8
# survives). Extra runs cost nothing (public repo) and break nothing — reports
# are driven by the state in state/seen.json, not by time, so an extra run just
# finds that nothing changed and stays silent. Minutes are deliberately off :00
# and :30 and spread out, so they don't hit the same peak.
on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      force_report:
        description: "Report all current showtimes, including already known ones"
        type: boolean
        default: false

# State is committed back to the repo — concurrent runs would overwrite each
# other's commit.
concurrency:
  group: watchdog
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the schedule
        id: watch
        # Want to watch a different film or auditorium type? Change these two
        # values and delete state/seen.json (otherwise the new selection gets
        # compared against the old state).
        env:
          FILM_PATTERN: odyss
          AUDITORIUM_PATTERN: imax
          # Language of film/cinema names from the API. Falls back to cs_CZ
          # automatically if the API does not serve this one.
          API_LANG: en_GB
        run: |
          python3 watch.py \
            --state state/seen.json \
            --report report.md \
            --title title.txt \
            ${{ inputs.force_report && '--force-report' || '' }}

      - name: Open an issue with the new showtimes
        if: steps.watch.outputs.has_news == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Assigning the owner is the key part: by default GitHub only e-mails
          # "Participating" notifications (assignments, mentions). Merely
          # "Watching" a repo gives a web/mobile notification; e-mail is off.
          url=$(gh issue create \
            --title "$(cat title.txt)" \
            --body-file report.md \
            --assignee "${{ github.repository_owner }}")
          echo "Created: $url"
          # The issue is only a delivery channel for the notification — the
          # e-mail goes out on creation, so we close it right away and the list
          # of open issues stays empty. The content remains readable under
          # closed issues.
          gh issue close "$url" --reason completed

      - name: Save state back to the repo
        run: |
          rm -f report.md title.txt
          if git diff --quiet -- state/seen.json; then
            echo "State unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          git commit -m "Update schedule state ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          # state/seen.json is a complete snapshot regenerated on every run —
          # if two runs race, keeping the fresher version is enough, no
          # line-level merge needed. "-X ours" resolves any conflict
          # automatically in favour of the run that just finished.
          for i in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git merge -X ours --no-edit "origin/${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          echo "::error::Pushing the state failed."
          exit 1
